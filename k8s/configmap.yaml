apiVersion: v1
kind: ConfigMap
metadata:
  name: settleflow-config
  namespace: settleflow
data:
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/settleflow"
  SPRING_DATASOURCE_USERNAME: "postgres"
  SPRING_DATASOURCE_DRIVER_CLASS_NAME: "org.postgresql.Driver"
  SPRING_JPA_DATABASE_PLATFORM: "org.hibernate.dialect.PostgreSQLDialect"
  CORS_ALLOWED_ORIGIN: "http://localhost:3000"
  NEXT_PUBLIC_BACKEND_URL: "http://backend-service:8080"
  BACKEND_URL: "http://backend-service:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: settleflow-secrets
  namespace: settleflow
type: Opaque
stringData:
  POSTGRES_PASSWORD: "password123"
  SPRING_DATASOURCE_PASSWORD: "password123"
