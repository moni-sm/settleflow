apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciliation-cronjob
  namespace: settleflow
spec:
  schedule: "0 6 * * *" # Daily at 06:00 UTC
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: reconciliation-worker
              image: ghcr.io/moni-sm/settleflow-recon:latest
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: settleflow-config
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "200m"
          restartPolicy: OnFailure
