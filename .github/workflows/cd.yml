name: SettleFlow CD / Container Registry & K8s Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # -----------------------------------------------------------
  # 1. Build and Publish Docker Images to GHCR
  # -----------------------------------------------------------
  build-and-push-images:
    name: Build & Push Container Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend Image
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Frontend Image
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build PSP Mocks Image
      - name: Build & Push PSP Mocks Image
        uses: docker/build-push-action@v5
        with:
          context: ./psp-mocks
          file: ./psp-mocks/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-psp-mocks:latest
            ${{ env.IMAGE_PREFIX }}-psp-mocks:${{ github.sha }}

      # Build Reconciliation Worker Image
      - name: Build & Push Reconciliation Worker Image
        uses: docker/build-push-action@v5
        with:
          context: ./reconciliation
          file: ./reconciliation/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-recon:latest
            ${{ env.IMAGE_PREFIX }}-recon:${{ github.sha }}

  # -----------------------------------------------------------
  # 2. Validate Kubernetes Manifests
  # -----------------------------------------------------------
  validate-k8s:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    needs: build-and-push-images
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Validate K8s Manifest Rendering
        run: kustomize build k8s/ > rendered-manifests.yaml
